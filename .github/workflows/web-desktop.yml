name: Web and desktop builds
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm desktop:build
        env:
          VITE_SUPABASE_URL: ${{ vars.PCIX_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.PCIX_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: pcix-${{ runner.os }}
          path: |
            web/dist
            web/src-tauri/target/release/bundle
